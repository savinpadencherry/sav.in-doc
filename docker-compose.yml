version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://api:8000
    depends_on:
      - api
    volumes:
      - ./apps/web:/app
      - /app/node_modules
    command: npm run dev

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///app/data/chainsync.db
      - USE_LOCAL_ADAPTERS=true
    volumes:
      - ./apps/api:/app
      - ./data:/app/data
      - ./packages/ai:/app/packages/ai
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  data: